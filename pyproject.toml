[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recomer-erc"
version = "0.1.0"
description = "History admission and contribution routing for multimodal conversational emotion recognition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/China-hanwudi/ReCoMER"

[tool.setuptools.packages.find]
include = ["recomer*"]

[tool.pytest.ini_options]
testpaths = ["tests/recomer"]
